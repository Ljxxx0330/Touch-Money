<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="TouchMoney 触钱：给大学生用的消费感知与资金管理网页原型。钱包里装着真实面额的纸币，花了多少就抽出多少，让数字重新拥有重量。">
  <title>TouchMoney 触钱 · 让每一笔消费都被真正感受到</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2321492f'/%3E%3Crect x='6' y='10' width='20' height='14' rx='4' fill='%23c8a04a'/%3E%3Crect x='8' y='7' width='16' height='6' rx='3' fill='%23e7cd94'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div id="app">
    <noscript>
      <div class="boot-error">
        <h1>TouchMoney 触钱</h1>
        <p>这个页面需要 JavaScript 才能运行。它把消费记录存在这台设备的浏览器本地存储里，不会上传到任何服务器。</p>
        <p class="muted-note">请在浏览器设置里允许执行 JavaScript，然后刷新页面。</p>
      </div>
    </noscript>
  </div>

  <div class="boot-error" hidden>
    <h1>TouchMoney 触钱</h1>
    <p>页面没能启动。可能是本地文件路径不对，或浏览器不支持所需的功能。</p>
    <p class="muted-note">双击项目文件夹里的 <code>启动.bat</code>（它会自己起本地服务并打开浏览器），或手动运行 <code>node tools/serve.cjs</code> 再打开 <code>http://127.0.0.1:4173/</code>。</p>
  </div>

  <div class="no-module" hidden="true">
    <h1>TouchMoney 触钱</h1>
    <p>你的浏览器不支持现代的 ES Modules，所以这个页面还跑不起来。</p>
    <p class="muted-note">换成较新的 Chrome、Edge、Firefox 或 Safari 就可以。这个应用不需要服务器，也不需要账号。</p>
  </div>

  <script src="./js/vendor/gsap.min.js"></script>
  <script>
    // 内置的 GSAP 没加载成功也不能整个页面打不开：动画退化成「直接跳到终态」
    window.__noGsap = typeof window.gsap === "undefined";
    if (window.__noGsap) console.warn("GSAP 没加载成功，钱包动画会退化成瞬时切换。");
  </script>
  <script type="module">
    // 用动态 import 才能捕获模块加载失败，给旧浏览器一个能看懂的说明
    import('./js/core/app.js').catch((err) => {
      console.error('模块加载失败：', err);
      const note = document.querySelector('.no-module');
      if (note) note.hidden = false;
    });
  </script>
</body>
</html>
